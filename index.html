<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06102A">
<meta name="description" content="Orthosphere · protótipo navegável da jornada do médico ortopedista, do acionamento à recuperação. Dados fictícios.">
<title>Orthosphere · Síntegra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy1:#06102A;--navy2:#0E244C;--navy:#122B49;
  --cyan:#009FE3;--cyan2:#7FD3F7;--white:#FFFFFF;--gray:#9D9D9C;
  --glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.05);--line:rgba(255,255,255,.18);--line2:rgba(255,255,255,.1);
  --r:24px;--ease:cubic-bezier(.2,.7,.3,1);--t:220ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#06102A linear-gradient(160deg,#06102A 0%,#0E244C 100%) fixed}
body{min-height:100vh;min-height:100dvh;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:300;color:var(--white);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;
  background:radial-gradient(70% 45% at 10% 0%,rgba(0,159,227,.18),transparent 70%),radial-gradient(60% 40% at 100% 100%,rgba(0,159,227,.08),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan2);outline-offset:3px;border-radius:12px}
svg text{font-family:inherit}
b,strong{font-weight:600}
h1{font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
h2{font-size:17px;font-weight:600;letter-spacing:-.005em}
h3{font-size:15px;font-weight:600}
p{line-height:1.5}
.small{font-size:13px}.xs{font-size:12px}.muted{color:var(--gray)}.cy{color:var(--cyan)}.cy2{color:var(--cyan2)}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--cyan2);font-weight:400}
.num{font-weight:600;font-size:26px;letter-spacing:-.02em;line-height:1}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:4px}
.grow{flex:1;min-width:0}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}

/* ---------- strip + frame ---------- */
.strip{position:fixed;top:0;left:0;right:0;height:22px;z-index:80;display:flex;align-items:center;justify-content:center;
  font-size:11px;letter-spacing:.06em;color:var(--gray);background:rgba(3,9,26,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.stage{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:stretch}
.phone{position:relative;width:100%;max-width:480px;display:flex;flex-direction:column;overflow:hidden;padding-top:22px;height:100vh;height:100dvh}
@media (min-width:600px){
  .stage{align-items:center;padding:44px 16px 24px}
  .phone{max-width:430px;height:min(900px,calc(100vh - 68px));border-radius:46px;border:1px solid var(--line);padding-top:12px;
    box-shadow:0 50px 100px rgba(0,0,0,.55),0 0 0 10px rgba(255,255,255,.035),0 0 0 11px rgba(255,255,255,.08);background:rgba(6,16,42,.5)}
}
.top{padding:12px 20px 6px}
.brand{font-weight:600;font-size:15px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand span{font-weight:300;font-size:12px;color:var(--gray)}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 16px 28px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.view{display:flex;flex-direction:column;gap:14px}
.view.anim{animation:in var(--t) var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.head{padding:6px 4px 2px}

/* ---------- journey ---------- */
.jr{position:relative;display:flex;list-style:none;margin-top:12px;padding:0 4px}
.jr::before,.jr .fill{content:"";position:absolute;top:6px;left:calc(10% + 4px);height:1.5px;background:var(--line);right:calc(10% + 4px)}
.jr .fill{right:auto;background:var(--cyan);transition:width .6s var(--ease)}
.jr li{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative}
.jr i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);background:#0B1D3F;transition:background .3s,border-color .3s,box-shadow .3s}
.jr li.on i{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,159,227,.18)}
.jr li.cur i{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 4px rgba(0,159,227,.25)}70%{box-shadow:0 0 0 10px rgba(0,159,227,0)}100%{box-shadow:0 0 0 4px rgba(0,159,227,0)}}
.jr span{font-size:9.5px;color:var(--gray);letter-spacing:.02em;white-space:nowrap}
.jr li.on span{color:var(--cyan2)}

/* ---------- tabs ---------- */
.tabs{display:flex;border-top:1px solid var(--line2);background:rgba(6,16,42,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;color:var(--gray);transition:color .2s,transform .15s}
.tabs button:active{transform:scale(.95)}
.tabs button[aria-current]{color:var(--cyan)}
.tabs button[aria-current] .ic{filter:drop-shadow(0 0 6px rgba(0,159,227,.55))}

/* ---------- surfaces ---------- */
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card.tight{padding:14px 16px}
.card.hi{border-color:rgba(0,159,227,.5);background:rgba(0,159,227,.1)}
.card.warn{border-color:rgba(255,196,120,.45);background:rgba(255,196,120,.08)}
.sub{background:var(--glass2);border:1px solid var(--line2);border-radius:18px;padding:12px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px;color:var(--cyan2);white-space:nowrap}
.chip.ok{background:rgba(0,159,227,.16);border-color:rgba(0,159,227,.5)}
.chip.dim{color:var(--gray)}
.chip.warn{color:#FFD9A8;border-color:rgba(255,196,120,.5);background:rgba(255,196,120,.1)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px rgba(0,159,227,.7);flex:none}
.dot.off{background:var(--gray);box-shadow:none;opacity:.6}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan2);padding:4px 9px;border-radius:999px;background:rgba(0,159,227,.14);border:1px solid rgba(0,159,227,.45)}
.badge.ok{color:var(--navy1);background:var(--cyan);border-color:var(--cyan)}
.badge.gray{color:var(--gray);background:transparent;border-color:var(--line)}
.sep{height:1px;background:var(--line2);margin:14px 0}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line2);min-height:44px}
.item:first-child{border-top:0;padding-top:4px}
.item .t{font-size:14.5px}.item .s{font-size:12px;color:var(--gray);margin-top:2px}
.ibox{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);color:var(--cyan2);flex:none}
.ibox.cy{background:rgba(0,159,227,.18);color:var(--cyan)}
.ibox.ok{background:var(--cyan);color:var(--navy1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--glass2);border:1px solid var(--line2);border-radius:16px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat b{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.stat .lbl{font-size:10px}

/* ---------- buttons ---------- */
.btn{min-height:48px;padding:0 18px;border-radius:16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;
  transition:transform .15s var(--ease),opacity .2s,background .2s,box-shadow .2s;width:100%}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--cyan);color:var(--navy1);box-shadow:0 10px 30px rgba(0,159,227,.25)}
.btn.sec{background:var(--navy);color:var(--cyan2);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--cyan2);border-color:var(--line2)}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.next{margin-top:6px}
.btns{display:flex;gap:10px}
.x{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gray);margin-right:-10px}
.x:active{background:rgba(255,255,255,.08)}

/* ---------- notification ---------- */
.notif{display:flex;gap:12px;align-items:center;padding:14px 14px 14px 16px;border-radius:20px;background:rgba(0,159,227,.14);border:1px solid rgba(0,159,227,.5);
  animation:drop .55s var(--ease) both;animation-delay:.35s;box-shadow:0 14px 40px rgba(0,159,227,.15)}
@keyframes drop{from{opacity:0;transform:translateY(-22px) scale(.97)}to{opacity:1;transform:none}}
.notif .ibox{animation:ring 1.6s var(--ease) .9s 1}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
.appear{animation:in .4s var(--ease) both}
.d1{animation-delay:.55s}.d2{animation-delay:.7s}.d3{animation-delay:.85s}

/* ---------- toggles / selection ---------- */
.opt{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid var(--line2);width:100%;text-align:left;min-height:44px}
.opt:first-child{border-top:0;padding-top:2px}
.opt .ck{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px;transition:background .2s,border-color .2s;color:var(--navy1)}
.opt .ck svg{opacity:0;transform:scale(.6);transition:all .2s var(--ease)}
.opt[aria-checked="true"] .ck{background:var(--cyan);border-color:var(--cyan)}
.opt[aria-checked="true"] .ck svg{opacity:1;transform:none}
.opt[disabled]{opacity:.6;pointer-events:none}
.plate{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:1px solid var(--line2);background:var(--glass2);width:100%;text-align:left;transition:border-color .2s,background .2s;position:relative}
.plate+.plate{margin-top:8px}
.plate .sz{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;background:rgba(255,255,255,.07);color:var(--cyan2);flex:none}
.plate[aria-checked="true"]{border-color:var(--cyan);background:rgba(0,159,227,.12)}
.plate[aria-checked="true"] .sz{background:var(--cyan);color:var(--navy1)}
.plate .sug{position:absolute;top:-9px;right:12px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy1);background:var(--cyan2);padding:3px 8px;border-radius:999px;font-weight:600}
.segs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line2)}
.segs button{min-width:44px;min-height:36px;border-radius:999px;font-size:13px;color:var(--gray);padding:0 10px;transition:all .2s}
.segs button[aria-pressed="true"]{background:var(--cyan);color:var(--navy1);font-weight:600}

/* ---------- range ---------- */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:4px 0 2px}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--cyan) var(--p,53%),rgba(255,255,255,.18) var(--p,53%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--cyan)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:6px solid var(--cyan);margin-top:-12px;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:6px solid var(--cyan);box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--gray);padding:0 4px}

/* ---------- limb ---------- */
.limbwrap{display:flex;flex-direction:column;gap:10px}
.limbwrap>.col{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px!important}
.limb{padding:6px 0;display:flex;justify-content:center;align-items:center;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03))}
.limb svg{width:100%;max-width:240px;height:auto;display:block;overflow:visible}
.limbwrap .stat{padding:9px 8px 8px;justify-content:center;text-align:center;align-items:center}
.limbwrap .stat b{font-size:14.5px!important}
.limbwrap .stat b{font-size:16px}
.axis{margin-top:10px;font-size:14px;line-height:1.45}
.axis b{color:var(--cyan2);font-size:16px}
.axis .st{display:inline-block;margin-left:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.axis .st.ok{color:var(--navy1);background:var(--cyan2);border-color:var(--cyan2);font-weight:600}
.axis .st.no{color:#FFD9A8;border-color:rgba(255,196,120,.5)}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column}
.tl .st{display:flex;gap:14px;align-items:flex-start;position:relative;padding:0 0 18px}
.tl .st::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:1.5px;background:var(--line2)}
.tl .st:last-child{padding-bottom:0}.tl .st:last-child::before{display:none}
.tl .st.done::before{background:rgba(0,159,227,.6)}
.tl .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;background:#0B1D3F;color:var(--navy1);transition:all .3s}
.tl .done .n{background:var(--cyan);border-color:var(--cyan)}
.tl .cur .n{border-color:var(--cyan);animation:pulse 1.6s infinite}
.tl .cur .n::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan)}
.tl .t{font-size:14.5px;color:var(--gray)}
.tl .done .t,.tl .cur .t{color:#fff}
.tl .cur .t{font-weight:600}
.tl .s{font-size:12px;color:var(--gray);margin-top:2px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--cyan);border-radius:3px;transition:width .25s linear}

/* ---------- smart box ---------- */
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bx{border:1px dashed var(--line);border-radius:18px;padding:12px;min-height:118px;display:flex;flex-direction:column;gap:6px}
.bx.ret{border-color:rgba(0,159,227,.45)}
.bx .lbl{font-size:10px;margin-bottom:2px}
.pill{font-size:12px;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line2);animation:in .35s var(--ease) both;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.use{background:rgba(0,159,227,.18);border-color:rgba(0,159,227,.5);color:var(--cyan2)}
.pill.miss{border-color:rgba(255,196,120,.6);color:#FFD9A8}
.use-row{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px;border-radius:14px;background:var(--glass2);border:1px solid var(--line2);flex-wrap:wrap}
.empty{font-size:12px;color:var(--gray);font-style:normal;opacity:.8}
.log{font-size:12px;color:var(--gray);display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto}
.log div{display:flex;gap:10px;animation:in .3s var(--ease) both}
.log time{color:var(--cyan2);flex:none;font-variant-numeric:tabular-nums}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(255,196,120,.1);border:1px solid rgba(255,196,120,.5);animation:in .35s var(--ease) both}
.alert .ibox{background:rgba(255,196,120,.15);color:#FFD9A8}

/* ---------- counters / misc ---------- */
.big{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--cyan)}
.saude{width:56px;height:56px;border-radius:50%;border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:var(--cyan2);letter-spacing:-.01em;flex:none;box-shadow:0 0 0 6px rgba(0,159,227,.12)}
.bubble{position:relative;padding:14px 16px;border-radius:20px 20px 20px 6px;background:rgba(0,159,227,.12);border:1px solid rgba(0,159,227,.4);font-size:14.5px;line-height:1.5}
.ring{flex:none}
.foot{display:flex;align-items:center;gap:14px;padding:4px 2px}
.foot p{font-size:15px;line-height:1.4}
.src{display:grid;grid-template-columns:1fr;gap:8px}
.src div{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--glass2);border:1px solid var(--line2);font-size:14px;min-height:44px}
.src .st{margin-left:auto;font-size:11px;color:var(--cyan2)}
.skel i{display:block;height:12px;border-radius:6px;background:rgba(255,255,255,.1);margin:12px 0;animation:sh 1.2s infinite}
@keyframes sh{0%,100%{opacity:.5}50%{opacity:1}}
.laudo-text p{font-size:14px;line-height:1.55;margin:10px 0;color:rgba(255,255,255,.88)}
.laudo-text p b{color:var(--cyan2)}
.okmark{width:72px;height:72px;border-radius:50%;background:var(--cyan);color:var(--navy1);display:flex;align-items:center;justify-content:center;margin:12px auto 8px;animation:pop .45s var(--ease) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:14px}
.kv:first-child{border-top:0;padding-top:0}
.kv span:last-child{font-weight:600;text-align:right}

/* ---------- sheet + toast ---------- */
#sheet{position:absolute;inset:0;z-index:50;pointer-events:none}
#sheet.open{pointer-events:auto}
.sheet-bg{position:absolute;inset:0;background:rgba(3,9,26,.6);opacity:0;transition:opacity .25s}
.open .sheet-bg{opacity:1}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;background:#0C1E40;border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 20px 30px;
  transform:translateY(100%);transition:transform .28s var(--ease);max-height:84%;overflow:auto;box-shadow:0 -20px 60px rgba(0,0,0,.4)}
@media (min-width:600px){.sheet-panel{border-radius:28px 28px 46px 46px;border-bottom:1px solid var(--line);padding-bottom:36px}}
.open .sheet-panel{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#toast{position:absolute;left:16px;right:16px;bottom:78px;z-index:60;display:flex;justify-content:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:999px;background:#0C1E40;border:1px solid rgba(0,159,227,.5);color:#fff;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);animation:toastin .3s var(--ease) both}
.toast.out{animation:toastout .3s var(--ease) both}
@keyframes toastin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(10px)}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="strip" role="note">Protótipo · dados fictícios</div>
<div class="stage">
  <div class="phone" id="app">
    <header class="top">
      <div class="brand">Orthosphere <span>Síntegra · Grupo Jacto</span></div>
      <ol class="jr" id="journey" aria-label="Jornada do paciente"></ol>
    </header>

function countUp(el, to, ms = 900) {
  const t0 = performance.now();
  const tick = () => { const p = Math.min(1, (performance.now() - t0) / ms); const e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(to * e); if (p < 1) requestAnimationFrame(tick); };
  tick();
}

}
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(t => `<button data-act="tab:${t.id}" ${S.tab === t.id ? 'aria-current="page"' : ''} aria-label="${t.l}">${ico(t.i, 22, 1.9)}<span>${t.l}</span></button>`).join('');
}
function render() {
  renderJourney(); renderTabs();
  const main = $('#screen');
  const changed = lastTab !== S.tab;
  const top = main.scrollTop;
  main.innerHTML = `<div class="view ${changed ? 'anim' : ''}">${VIEWS[S.tab]()}</div>`;
  main.scrollTop = changed ? 0 : top;
  lastTab = S.tab;
  afterRender();
}
function afterRender() {
  const r = $('#angle');
  if (r) r.addEventListener('input', () => { S.angle = parseFloat(r.value); r.style.setProperty('--p', `${S.angle / 15 * 100}%`); r.setAttribute('aria-valuetext', `${fmt1(S.angle)} graus`); updatePlan(); });
  const av = $('#avoided');
  if (av && !S.counted) { S.counted = true; countUp(av, 34, 1100); }
}
function updatePlan() {
  const a = S.angle, g = geo(a);
  if (S.simDone) S.simDone = false;
  updateLimb(a, 0);
  $('#angVal').textContent = `${fmt1(a)}°`;
  $('#axisTxt').innerHTML = axisText(g.pct);
  $('#mOpen').textContent = `${fmt1(g.open)} mm`;
  $('#mFinal').textContent = finalTxt(a);
  $('#mPlate').textContent = plateFor(a);
  $('#mPct').textContent = `${Math.round(g.pct)}%`;
  if (!S.implantConfirmed) $('#plates').innerHTML = platesHTML();
}

/* ---------- ações ---------- */
function go(tab) {
  if (tab === 'posop') S.postVisited = true;
  S.tab = tab; render();
}
function nextStep() {
  const order = TABS.map(t => t.id);
  const i = order.indexOf(S.tab);
  if (S.tab === 'casos' && !S.accepted) S.accepted = true;
  if (S.tab === 'plano' && !S.implantConfirmed) { S.implant = S.implant || plateFor(S.angle); S.implantConfirmed = true; }
  if (S.tab === 'impressao') { if (!S.printSent) { S.printSent = true; S.printStep = 5; S.printProgress = 1; } S.surgery = true; }
  go(order[Math.min(i + 1, order.length - 1)]);
}
function simulate() {
  if (S.simRunning) return;
  S.simRunning = true; S.simDone = false; render();
  const target = S.angle, D = 1300;
  updateLimb(0, 0);
  later(() => {
    const t0 = performance.now();
    const tick = () => {
      const p = Math.min(1, (performance.now() - t0) / D), e = 1 - Math.pow(1 - p, 3);
      const a = target * Math.min(1, e / 0.95), plate = p > 0.7 ? (p - 0.7) / 0.3 : 0;
      const v = $('#angVal');
      updateLimb(a, plate);
      if (v) v.textContent = `${fmt1(a)}°`;
      if (p < 1) requestAnimationFrame(tick);
      else { S.simRunning = false; S.simDone = true; render(); toast('Simulação concluída · plano validado'); }
    };
    requestAnimationFrame(tick);
  }, 350);
}
function startPrint() {
  S.printSent = true; S.printStep = 0; S.printProgress = 0; render();
  toast('Enviado ao Centro de Impressão Síntegra', 'layers');
  const dur = [1800, 3200, 1800, 1800, 1900];
  const step = () => {
    const i = S.printStep;
    if (i === 1) {
      const t0 = performance.now();
      const tick = () => {
        const p = Math.min(1, (performance.now() - t0) / 3000); S.printProgress = p;
        const bar = $('#pbar'), tx = $('#ptxt');
        if (bar) bar.style.width = `${p * 100}%`; if (tx) tx.textContent = `${Math.round(p * 100)}%`;
        if (p < 1 && S.printStep === 1) requestAnimationFrame(tick);
      };
      tick();
    }
    later(() => {
      S.printStep = i + 1; render();
      if (S.printStep < 5) step(); else toast('Material entregue no hospital', 'building');
    }, dur[i]);
  };
  step();
}
function simBox() {
  const b = S.box; if (b.running || b.done) return;
  b.running = true; render();
  const base = 10 * 60 + 32;
  b.log.push({ t: hm(base), m: 'Caixa estéril aberta · sala 3' });
  b.items.forEach((it, i) => {
    later(() => { it.st = 'uso'; b.log.push({ t: hm(base + 4 + i * 18), m: `${it.n} saiu da caixa estéril` }); render(); }, 600 + i * 1500);
    if (i < 3) later(() => { it.st = 'retorno'; b.log.push({ t: hm(base + 16 + i * 18), m: `${it.n} retornou` }); render(); }, 600 + i * 1500 + 1000);
  });
  later(() => {
    b.running = false; b.done = true; b.missing = true; S.surgery = true;
    b.log.push({ t: hm(base + 62), m: 'Fim da cirurgia · consumo registrado' });
    render(); toast('Cirurgia registrada · 1h02', 'check');
  }, 600 + 4 * 1500 + 500);
}
function act(a, el) {
  const [k, v] = a.split(':');
  switch (k) {
    case 'tab': go(v); break;
    case 'next': nextStep(); break;
    case 'sheet-close': closeSheet(); break;
    case 'accept': S.accepted = true; render(); toast('Caso aceito · em planejamento'); break;
    case 'forward-case':
      openSheet(`<div class="sh-h"><h2>Encaminhar para colega</h2><button class="x" data-act="sheet-close" aria-label="Fechar">${ico('close', 18)}</button></div><p class="small muted">O colega recebe o caso completo, com exames e prontuário.</p><div class="list mt12">
        ${COLLEAGUES.map(c => `<button class="item" data-act="forward-to:${c.n}" style="width:100%;text-align:left"><div class="ibox">${ico('user', 18)}</div><div class="grow"><div class="t">${c.n}</div><div class="s">${c.s}</div></div>${ico('chev', 18)}</button>`).join('')}</div>`);
      break;
    case 'forward-to':
      $('.sheet-panel').innerHTML = `<div class="grab"></div><div class="okmark">${ico('check', 34, 3)}</div><h2 style="text-align:center">Solicitação enviada</h2><p class="small muted mt8" style="text-align:center">${v} recebe o caso agora. Você segue como responsável até a aceitação.</p>`;
      later(closeSheet, 1700); break;
    case 'laudo': {
      const l = LAUDOS.find(x => x.id === v);
      openSheet(`<div class="sh-h"><span class="lbl">Laudo</span><button class="x" data-act="sheet-close" aria-label="Fechar">${ico('close', 18)}</button></div><h2>${l.t}</h2><p class="xs muted mt4">${l.meta}</p><div id="laudoBody" class="skel mt12"><i></i><i></i><i style="width:85%"></i><i></i><i style="width:55%"></i></div>`);
      later(() => { const b = $('#laudoBody'); if (b) { b.className = 'laudo-text mt8'; b.innerHTML = l.text.map(p => `<p>${p}</p>`).join(''); } }, 650);
      break; }
    case 'fwd-laudo':
      openSheet(`<div class="sh-h"><h2>Encaminhar laudo</h2><button class="x" data-act="sheet-close" aria-label="Fechar">${ico('close', 18)}</button></div><p class="small muted">Os 3 laudos e os cuidados específicos seguem juntos.</p><div class="list mt12">
        ${FWD_TARGETS.map(t => `<button class="item" data-act="fwd-laudo-to:${t.t}" style="width:100%;text-align:left"><div class="ibox cy">${ico(t.i, 18)}</div><div class="grow"><div class="t">${t.t}</div><div class="s">${t.s}</div></div>${ico('chev', 18)}</button>`).join('')}</div>`);
      break;
    case 'fwd-laudo-to':
      if (!S.forwarded.includes(v)) S.forwarded.push(v);
      $('.sheet-panel').innerHTML = `<div class="grab"></div><div class="okmark">${ico('check', 34, 3)}</div><h2 style="text-align:center">Laudo encaminhado</h2><p class="small muted mt8" style="text-align:center">para ${v} · 3 laudos anexados · registrado no prontuário</p>`;
      later(() => { closeSheet(); render(); }, 1600); break;
    case 'simulate': simulate(); break;
    case 'pick-plate': S.implant = v; $('#plates').innerHTML = platesHTML(); $('[data-act="confirm-implant"]')?.removeAttribute('disabled'); break;
    case 'confirm-implant': if (!S.implant) return; S.implantConfirmed = true; render(); toast('Implante especificado no plano'); break;
    case 'toggle-print': S.print[v] = !S.print[v]; render(); break;
    case 'send-print': startPrint(); break;
    case 'sim-box': simBox(); break;
    case 'box-check':
      S.box.resolved = true; S.box.items[3].st = 'retorno';
      S.box.log.push({ t: '11:48', m: 'Afastador de tecidos localizado e devolvido' }); render(); toast('Item conferido · caixa fechada'); break;
    case 'week': S.week = +v; render(); break;
    case 'reset':
      timers.forEach(clearTimeout); timers = []; S = initial(); lastTab = null; closeSheet(); render(); break;
  }
}
$('#app').addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.hasAttribute('disabled')) act(el.dataset.act, el); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
render();
</script>
</body>
</html>
